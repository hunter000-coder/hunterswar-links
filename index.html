    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0d0d0d; color: #ffffff; font-family: -apple-system, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 32px 20px 48px; }

    .logo-wrap img { width: 210px; height: 210px; object-fit: contain; border-radius: 14px; display: block; }

    .video-wrap { width: 100%; border-radius: 14px; overflow: hidden; margin-bottom: 18px; background: #1a1a1a; aspect-ratio: 16/9; }
    .video-wrap iframe { width: 100%; height: 100%; border: none; display: block; }
    .cta-btn { display: block; width: 100%; background: #e8344b; color: #ffffff; text-align: center; text-decoration: none; font-size: 16px; font-weight: 600; letter-spacing: 0.3px; padding: 17px 24px; border-radius: 50px; transition: background 0.2s, transform 0.15s; }
    .cta-btn:hover { background: #cc2a3e; transform: translateY(-1px); }
    .cta-btn:active { transform: translateY(0); }
